<script type="text/x-dc" data-dc-script data-props="{&quot;vista&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hoja&quot;,&quot;animación&quot;],&quot;default&quot;:&quot;hoja&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fps&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:2,&quot;max&quot;:24,&quot;default&quot;:8,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { i: 0 };
  componentDidMount() {
    const tick = () => { this.setState(s => ({ i: (s.i + 1) % 12 })); this.t = setTimeout(tick, 1000 / (this.props.fps ?? 8)); };
    this.t = setTimeout(tick, 1000 / (this.props.fps ?? 8));
  }
  componentWillUnmount() { clearTimeout(this.t); }
  buildFrames() {
    if (this._frames) return this._frames;
    const Rd = Math.PI / 180;
    const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const f1 = v => v.toFixed(1);
    const ell = (cx, cy, rx, ry) => 'M' + f1(cx - rx) + ' ' + f1(cy) + ' a' + f1(rx) + ' ' + f1(ry) + ' 0 1 0 ' + f1(2 * rx) + ' 0 a' + f1(rx) + ' ' + f1(ry) + ' 0 1 0 ' + f1(-2 * rx) + ' 0 ';
    const foam = (r, cx, cy, rx, ry, a0, a1, crest) => {
      const n = 40, top = [], bot = [];
      for (let i = 0; i <= n; i++) {
        const a = (a0 + (a1 - a0) * i / n) * Rd, j = 1 + (r() - 0.5) * 0.12;
        const x = cx + Math.cos(a) * rx * j, y = cy + Math.sin(a) * ry * j;
        const h = (r() < 0.25 ? crest * (0.5 + r()) : crest * 0.25 * r()) * (Math.sin(a) > 0 ? 1 : 0.6);
        top.push([x, y - h]); bot.push([x + Math.cos(a) * 14, y + Math.sin(a) * 6 + 8]);
      }
      return 'M' + top.concat(bot.reverse()).map(p => f1(p[0]) + ' ' + f1(p[1])).join(' L') + ' Z';
    };
    const zig = (r, x1, y1, x2, y2, n, j) => { const p = [[x1, y1]], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L; for (let i = 1; i < n; i++) { const t = i / n, o = (r() - 0.5) * 2 * j; p.push([x1 + dx * t + nx * o, y1 + dy * t + ny * o]); } p.push([x2, y2]); return 'M' + p.map(q => f1(q[0]) + ' ' + f1(Math.max(-195, q[1]))).join(' L'); };
    const pts = [[468, 320], [532, 320], [500, 420], [420, 500], [580, 500], [500, 600], [400, 700], [600, 700], [470, 820], [540, 840], [300, 620], [700, 620], [250, 760], [750, 760]];
    // [label, fx, op, ghost, sink, arms(0 base..1 rigid), eye, halo, bolt, zapN, smoke, ash, ember, foamK, bubbles]
    const spec = [
      ['vivo', 'none', 1, 0.6, 0, 0, 1, 0, 0, 0, 0, 0, 0, 1, 0],
      ['impacto', 'url(#zFlash)', 1, 0.6, 0, 1, 1, 0.9, 2, 14, 0, 0, 0, 1.3, 0],
      ['electrocución A', 'url(#zZap)', 1, 0.6, 0, 1, 1, 0.55, 1, 12, 0, 0, 2, 1.4, 0],
      ['electrocución B', 'url(#zNeg)', 1, 0.6, 0, 0.9, 1, 0.35, 0, 12, 0.2, 0, 4, 1.4, 0],
      ['electrocución C', 'url(#zZap)', 1, 0.6, 0, 1, 1, 0.5, 1, 10, 0.3, 0, 6, 1.3, 0],
      ['carbonizado', 'url(#zChar)', 1, 0.5, 10, 0.6, 0, 0, 0, 3, 0.6, 8, 10, 1.1, 0],
      ['se desmorona', 'url(#zDis1)', 1, 0.4, 50, 0.4, 0, 0, 0, 2, 0.8, 24, 12, 1.2, 4],
      ['ceniza', 'url(#zDis2)', 1, 0.3, 130, 0.3, 0, 0, 0, 0, 0.9, 40, 10, 1.3, 6],
      ['se hunde', 'url(#zDis3)', 1, 0.2, 250, 0.2, 0, 0, 0, 0, 0.8, 46, 6, 1.1, 8],
      ['desaparece', 'url(#zDis4)', 1, 0.1, 380, 0.1, 0, 0, 0, 0, 0.6, 36, 3, 0.7, 10],
      ['burbujas', 'none', 0, 0, 500, 0, 0, 0, 0, 0, 0.35, 18, 0, 0.3, 8],
      ['calma', 'none', 0, 0, 500, 0, 0, 0, 0, 0, 0, 0, 0, 0, 3]
    ];
    this._frames = spec.map(([label, fx, op, ghost, sink, rig, eye, halo, boltN, zapN, smoke, ashN, emberN, foamK, bubN], k) => {
      const r = rng(k * 6131 + 17), jit = a => (r() - 0.5) * 2 * a;
      const shake = rig > 0.5 ? 1 : 0;
      const sx = jit(6 * shake), sy = jit(6 * shake) + sink, tilt = jit(4 * shake);
      const base = { lU: 108, lF: 228, lH: 262, rU: 72, rF: -48, rH: -82 }, hard = { lU: 118, lF: 214, lH: 244, rU: 62, rF: -34, rH: -64 };
      const A = key => base[key] + (hard[key] - base[key]) * rig + jit(3 * rig);
      const lU = A('lU'), lF = A('lF'), lH = A('lH'), rU = A('rU'), rF = A('rF'), rH = A('rH');
      const cx = 500 + sx, wy = 880;
      let bolt = '', zap = '', spark = '', ash = '', ember = '', smokeD = '', bub = '';
      for (let b = 0; b < boltN; b++) {
        const x0 = 470 + jit(140);
        bolt += zig(r, x0, -195, cx + jit(20), 250 + sy, 16, 34) + ' ';
        bolt += zig(r, cx + jit(30), 120, cx + jit(260), 40 + jit(60), 6, 18) + ' ';
      }
      for (let z = 0; z < zapN; z++) {
        const a = pts[Math.floor(r() * pts.length)], b2 = pts[Math.floor(r() * pts.length)];
        if (a === b2) continue;
        zap += zig(r, a[0] + sx, a[1] + sy, b2[0] + sx, b2[1] + sy, 7, 18) + ' ';
      }
      if (zapN) for (let z = 0; z < 4; z++) { const a = Math.PI + r() * Math.PI, rr = 140 + r() * 80; zap += zig(r, cx + Math.cos(a) * 30, wy, cx + Math.cos(a) * rr, wy + 8 + r() * 30, 5, 10) + ' '; }
      for (let p = 0; p < zapN; p++) { const q = pts[Math.floor(r() * pts.length)]; spark += ell(q[0] + sx + jit(60), q[1] + sy + jit(60), 2 + r() * 2.5, 2 + r() * 2.5); }
      const rise = Math.max(0, k - 4) * 60;
      for (let p = 0; p < ashN; p++) {
        const x = cx + jit(240), y = 260 + r() * 600 - rise * (0.4 + r() * 0.6) + sink * 0.3;
        if (y < -190 || y > 870) continue;
        const w = 3 + r() * 6, h = 2 + r() * 4, a = r() * 180;
        const c = Math.cos(a * Rd), sn = Math.sin(a * Rd);
        ash += 'M' + f1(x - w * c) + ' ' + f1(y - w * sn) + ' L' + f1(x + h * sn) + ' ' + f1(y - h * c) + ' L' + f1(x + w * c) + ' ' + f1(y + w * sn) + ' Z ';
      }
      for (let p = 0; p < emberN; p++) { const x = cx + jit(220), y = 300 + r() * 560 - rise * (0.6 + r() * 0.8) + sink * 0.3; if (y < -190 || y > 870) continue; ember += ell(x, y, 1.6 + r() * 2.2, 1.6 + r() * 2.2); }
      for (let p = 0; p < Math.round(smoke * 9); p++) { const x = cx + jit(170), y = 520 - rise * 0.8 - r() * 300 + sink * 0.2; if (y < -100) continue; ell; smokeD += ell(x, y, 50 + r() * 50, 40 + r() * 40); }
      for (let p = 0; p < bubN; p++) { const x = cx + jit(150), y = wy - 4 - r() * 20, rr = 3 + r() * 7; bub += ell(x, y, rr, rr * 0.8); }
      const ph = k / 12, rip = i => { const t = ((i / 3) + ph) % 1, sc = k >= 9 ? 1.2 : 1; return { d: ell(cx, wy + 6, (220 + t * 300) * sc, (220 + t * 300) * 0.12 * sc), o: ((k === 11 ? 0.3 : 0.55) * (1 - t)).toFixed(2) }; };
      const r1 = rip(0), r2 = rip(1), r3 = rip(2);
      let drops = '';
      if (foamK > 0.6) for (let d = 0; d < Math.round(12 * foamK); d++) { const a = (180 + r() * 180) * Rd, rad = 150 + r() * 130, x = cx + Math.cos(a) * rad, y = wy - 10 - r() * 120 * foamK; const rr = 2.5 + r() * 4.5; drops += ell(x, y, rr, rr * 1.3); }
      let splash = '';
      if (foamK > 0.25) for (let t = 0; t < 7; t++) { const a = (20 + t * 23 + jit(5)) * Rd, x = cx + Math.cos(a) * 180, y = wy + Math.sin(a) * 26; const h = (30 + r() * 50) * foamK, w = 14 + r() * 12, lean = Math.cos(a) * 30; splash += 'M' + f1(x - w) + ' ' + f1(y) + ' Q' + f1(x + lean * 0.5) + ' ' + f1(y - h * 1.2) + ' ' + f1(x + lean) + ' ' + f1(y - h) + ' Q' + f1(x + lean * 0.4) + ' ' + f1(y - h * 0.4) + ' ' + f1(x + w) + ' ' + f1(y) + ' Z '; }
      const fw = foamK > 0.25;
      return {
        file: 'draugr_death_' + String(k + 1).padStart(2, '0'), label,
        body: 'translate(' + f1(sx) + ' ' + f1(sy) + ') rotate(' + tilt.toFixed(2) + ' 500 880)',
        fx, op, ghost: ghost.toFixed(2), halo: halo.toFixed(2),
        head: f1(jit(8 * rig)), jaw: (0.7 + 0.5 * rig).toFixed(2),
        l1: f1(lU - 90), l2: f1(lF - lU), l3: f1(lH - lF), ls: (1.06 - 0.1 * rig).toFixed(2),
        r1: f1(rU - 90), r2: f1(rF - rU), r3: f1(rH - rF), rs: (1.06 - 0.1 * rig).toFixed(2),
        hoL: 1, hcL: 0, hoR: 1, hcR: 0, eye: eye, cx: f1(cx),
        legs: 'M440 960 L432 1110 L430 1250 M560 960 L568 1110 L570 1250',
        foamBack: fw ? foam(r, cx, wy, 178, 24, 180, 360, 22 * foamK) : 'M0 0', foamFront: fw ? foam(r, cx, wy, 182, 28, 0, 180, 34 * foamK) : 'M0 0',
        splash: splash || 'M0 0', drops: drops || 'M0 0',
        wake: k < 10 ? 'M' + f1(cx - 200) + ' 905 Q' + f1(cx - 300) + ' 950 ' + f1(cx - 420) + ' 1000 M' + f1(cx + 200) + ' 905 Q' + f1(cx + 300) + ' 950 ' + f1(cx + 420) + ' 1000' : 'M0 0',
        rip1: r1.d, ro1: r1.o, rip2: r2.d, ro2: r2.o, rip3: r3.d, ro3: r3.o,
        bolt: bolt || 'M0 0', zap: zap || 'M0 0', spark: spark || 'M0 0', ash: ash || 'M0 0', ember: ember || 'M0 0', smoke: smokeD || 'M0 0', bubbles: bub || 'M0 0'
      };
    });
    return this._frames;
  }
  renderVals() {
    const frames = this.buildFrames();
    const anim = (this.props.vista ?? 'hoja') === 'animación';
    return {
      frames: anim ? [frames[this.state.i % 12]] : frames,
      cols: anim ? 'minmax(0, min(560px, 70vh))' : 'repeat(auto-fill, minmax(220px, 1fr))'
    };
  }
}
