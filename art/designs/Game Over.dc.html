class Component extends DCLogic {
  state = { sc: 0.5 };
  componentDidMount() { this.fit = () => this.setState({ sc: Math.min(window.innerWidth / 1920, window.innerHeight / 1080) }); this.fit(); window.addEventListener('resize', this.fit); }
  componentWillUnmount() { window.removeEventListener('resize', this.fit); }
  renderVals() {
    const sc = this.state.sc;
    return { sc, w: Math.round(1920 * sc), h: Math.round(1080 * sc), score: this.props.score ?? 0, level: this.props.level ?? 1, titulo: this.props.titulo ?? 'The Draugar took the ship' };
  }
}
</script>
