<script type="text/x-dc" data-dc-script data-props="{&quot;vista&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hoja&quot;,&quot;animación&quot;],&quot;default&quot;:&quot;hoja&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fps&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:2,&quot;max&quot;:24,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;amplitud&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;guia&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;luzMartillo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { i: 0 };
  componentDidMount() {
    const tick = () => { this.setState(s => ({ i: (s.i + 1) % 12 })); this.t = setTimeout(tick, 1000 / (this.props.fps ?? 6)); };
    this.t = setTimeout(tick, 1000 / (this.props.fps ?? 6));
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const amp = this.props.amplitud ?? 1;
    const frames = Array.from({ length: 12 }, (_, k) => {
      const p = (k / 12) * Math.PI * 2;
      const rot = 1.2 * amp * Math.sin(p), dy = 9 * amp * Math.sin(p + Math.PI / 2), sy = 1 + 0.006 * amp * Math.sin(p + Math.PI / 3);
      return {
        t: 'translate(0 ' + dy.toFixed(2) + ') rotate(' + rot.toFixed(3) + ' 1300 1720) translate(1300 1720) scale(1 ' + sy.toFixed(4) + ') translate(-1300 -1720)',
        file: 'boat_idle_' + String(k + 1).padStart(2, '0'),
        label: 'rot ' + (rot >= 0 ? '+' : '') + rot.toFixed(2) + '° · y ' + (dy >= 0 ? '+' : '') + dy.toFixed(1)
      };
    });
    const anim = (this.props.vista ?? 'hoja') === 'animación';
    return {
      frames: anim ? [frames[this.state.i % 12]] : frames,
      cols: anim ? 'minmax(0, min(1100px, 100%))' : 'repeat(auto-fill, minmax(320px, 1fr))',
      guide: this.props.guia ?? false,
      wet: (this.props.agua ?? true) ? 1 : 0,
      rim: (this.props.luzMartillo ?? true) ? 1 : 0
    };
  }
}
