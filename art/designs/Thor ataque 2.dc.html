    const zig = (r, x1, y1, x2, y2, n, j) => { const p = [[x1, y1]], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L; for (let i = 1; i < n; i++) { const t = i / n, o = (r() - 0.5) * 2 * j; p.push([x1 + dx * t + nx * o, y1 + dy * t + ny * o]); } p.push([x2, y2]); return p; };
    const P = pts => 'M' + pts.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L');
    const bolt = (r, pts, n, j, nb) => { let d = ''; for (let k = 0; k < pts.length - 1; k++) { const [x1, y1] = pts[k], [x2, y2] = pts[k + 1]; const m = zig(r, x1, y1, x2, y2, n, j); d += (k ? ' L' + P(m.slice(1)).slice(1) : P(m)); for (let q = 0; q < nb; q++) { const i = 1 + Math.floor(r() * (n - 2)), [bx, by] = m[i], ang = Math.atan2(y2 - y1, x2 - x1) + (r() < 0.5 ? -1 : 1) * (0.4 + r() * 0.7), len = Math.hypot(x2 - x1, y2 - y1) * (0.18 + r() * 0.22); d += ' ' + P(zig(r, bx, by, bx + Math.cos(ang) * len, by + Math.sin(ang) * len, 4, j * 0.6)); } } return d; };
    const lerp = (a, b, t) => a + (b - a) * t;
    // [label, right: {ang:[U,F,H]} | {cr:[x,y],H}, k1, k2, left: {ang:[U,F]} | {reach:[dx,dy]} | 'grip', glow, fx level, seed]
    const spec = [
      ['reposo', { ang: [68, 82, 90] }, 1, 1, { ang: [94.71, 95.93] }, 0, 0, 1],
      ['agarre', { ang: [30, -5, 20] }, 1.08, 1.06, { ang: [112, 70] }, 0.1, 0, 2],
      ['subida', { ang: [-75, -92, -70] }, 1.2, 1.15, { ang: [222, 292] }, 0.3, 0, 3],
      ['sobre la cabeza', { cr: [508, 132], H: -97 }, 1.3, 1.24, 'grip', 0.55, 1, 4],
      ['carga', { cr: [505, 122], H: -95 }, 1.33, 1.25, 'grip', 0.8, 2, 5],
      ['invocación', { cr: [505, 120], H: -94 }, 1.33, 1.25, 'grip', 1, 3, 6],
      ['tormenta A', { cr: [503, 121], H: -95.5 }, 1.33, 1.25, 'grip', 1, 4, 7],
      ['tormenta B', { cr: [506, 120], H: -94.5 }, 1.33, 1.25, 'grip', 1, 4, 8],
      ['descenso', { ang: [-75, -92, -70] }, 1.2, 1.15, { ang: [222, 292] }, 0.4, 0, 9],
      ['retorno', { ang: [30, -5, 20] }, 1.08, 1.06, { ang: [112, 70] }, 0.1, 0, 10],
      ['idle', { ang: [68, 82, 90] }, 1, 1, { ang: [94.71, 95.93] }, 0, 0, 11]
    ];
    this._frames = spec.map(([label, rs, k1, k2, ls, glow, fx, seed], idx) => {
      const a = A0 * k1, b = B0 * k2;
      let U, F, H;
      if (rs.ang) { [U, F, H] = rs.ang; }
      else { H = rs.H; const o = rot(OFF, H - H0); const W = [rs.cr[0] - o[0], rs.cr[1] - o[1]]; const r = ik(S, W, a, b, 1); U = r.U; F = r.F; }
      const E = [S[0] + a * dir(U)[0], S[1] + a * dir(U)[1]];
      const W = [E[0] + b * dir(F)[0], E[1] + b * dir(F)[1]];
      const o = rot(OFF, H - H0), CR = [W[0] + o[0], W[1] + o[1]];
      const Hc = [CR[0] + 108.6 * dir(H)[0], CR[1] + 108.6 * dir(H)[1]];
      let UL, FL, CL;
      if (ls.ang) { [UL, FL] = ls.ang; }
      else {
        const t = ls === 'grip' ? [CR[0] - 45 * dir(H)[0], CR[1] - 45 * dir(H)[1]] : [CR[0] + ls.reach[0], CR[1] + ls.reach[1]];
        const r = ik(SL, t, AL, BL, -1); UL = r.U; FL = r.F;
      }
      const EL = [SL[0] + AL * dir(UL)[0], SL[1] + AL * dir(UL)[1]];
      CL = [EL[0] + BL * dir(FL)[0], EL[1] + BL * dir(FL)[1]];
      const a1 = norm(U - U0, -180), a2 = norm(F - U - (F0 - U0), -180), a3 = norm(H - F - (H0 - F0), -180);
      const b1 = norm(UL - UL0, -60), b2 = norm(FL - UL - (FL0 - UL0), -180);
      const r = rng(seed * 977);
      let front = '', back = '';
      const add = (which, pts, n, j, nb) => { const d = bolt(r, pts, n, j, nb); if (which) front += ' ' + d; else back += ' ' + d; };
      const [hx, hy] = Hc;
      if (fx >= 1) {
        add(1, [[hx - 82, hy - 6], [hx - 120, hy - 58]], 5, 8, 0);
        add(1, [[hx + 82, hy - 4], [hx + 126, hy - 50]], 5, 8, 0);
        add(1, [[hx - 60, hy + 42], [hx - 112, hy + 76]], 5, 8, 0);
        add(1, [[hx + 62, hy + 40], [hx + 108, hy + 82]], 5, 8, 0);
      }
      if (fx >= 2) {
        add(1, [CL, EL], 8, 9, 1);
        add(1, [CR, E], 8, 9, 1);
        add(1, [[hx, hy - 46], [hx - 18, hy - 110]], 5, 9, 1);
      }
      if (fx >= 3) {
        add(1, [[hx - 30, hy - 44], [hx - 120, -190]], 12, 18, 2);
        add(1, [[hx + 2, hy - 46], [hx + 20, -205]], 12, 16, 1);
        add(1, [[hx + 34, hy - 44], [hx + 140, -185]], 12, 18, 2);
        add(1, [[hx - 80, hy + 4], [330, 300], [298, 460]], 8, 16, 1);
        add(1, [[hx + 80, hy + 4], [684, 290], [708, 450]], 8, 16, 1);
      }
      if (fx >= 4) {
        add(0, [[298, 460], [266, 640], [300, 820], [350, 980]], 7, 16, 1);
        add(0, [[708, 450], [738, 640], [702, 820], [660, 980]], 7, 16, 1);
        add(0, [[350, 980], [328, 1120], [384, 1250]], 6, 14, 1);
        add(0, [[660, 980], [684, 1120], [620, 1250]], 6, 14, 1);
        add(0, [[424, 1250], [330, 1238]], 5, 8, 0);
        add(0, [[580, 1250], [680, 1240]], 5, 8, 0);
      }
      const f = n => n.toFixed(2);
      return {
        label, file: 'thor_atk2_' + String(idx + 1).padStart(2, '0'),
        a1: f(a1), a2: f(a2), a3: f(a3), ap: f(a1 * 0.3), b1: f(b1), b2: f(b2), pl: f(b1 * 0.25),
        s1: 'translate(645 458) rotate(' + U0 + ') scale(' + k1 + ' 1) rotate(' + (-U0) + ') translate(-645 -458)',
        t1: 'translate(' + f((k1 - 1) * 93) + ' ' + f((k1 - 1) * -120) + ')',
        s2: 'translate(738 338) rotate(' + F0 + ') scale(' + k2 + ' 1) rotate(' + (-F0) + ') translate(-738 -338)',
        t2: 'translate(' + f((k2 - 1) * 25) + ' ' + f((k2 - 1) * -116) + ')',
        glow, aura: fx >= 4 ? 0.4 : fx >= 3 ? 0.2 : 0,
        frontD: front.trim() || 'M0 0', backD: back.trim() || 'M0 0'
      };
    });
    return this._frames;
  }
  renderVals() {
    const frames = this.buildFrames();
    const anim = (this.props.vista ?? 'hoja') === 'animación';
    return {
      frames: anim ? [frames[this.state.i % frames.length]] : frames,
      cols: anim ? 'minmax(0, min(560px, 70vh))' : 'repeat(auto-fill, minmax(220px, 1fr))',
      capa: this.props.capa ?? false
    };
  }
}
