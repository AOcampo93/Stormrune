<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="560" height="280" viewBox="0 0 560 280">
  <!-- The player's longship, seen from behind as it faces the open sea.
       A warrior stands at the bow in a three-quarter back view (so the
       braided beard shows), round helmet, cloak, hammer raised. Original
       design, flat dark silhouettes from the game palette. -->
  <defs>
    <linearGradient id="hull-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16294A"/>
      <stop offset="1" stop-color="#0A121E"/>
    </linearGradient>
    <g id="warrior">
      <!-- cloak, caught by the wind on the left -->
      <path d="M204 104 C196 140 186 190 170 236 L186 230 L192 238 L300 238 C292 196 286 150 284 106 C268 96 222 96 204 104 Z"/>
      <!-- shoulders -->
      <path d="M200 112 C204 96 222 92 244 92 C266 92 282 98 288 112 Z"/>
      <!-- raised arm and the hammer: a long handle and a plain square head -->
      <path d="M208 108 C196 90 186 70 180 46 L192 42 C198 64 210 84 224 100 Z"/>
      <path d="M181 50 L177 4 L185 3 L189 49 Z"/>
      <path d="M160 2 C160 -1 162 -3 165 -3 L198 -5 C201 -5 203 -3 203 0 L204 20 C204 23 202 25 199 25 L166 27 C163 27 161 25 161 22 Z"/>
      <!-- head turned slightly to the right -->
      <path d="M226 78 C226 62 236 54 246 54 C258 54 266 64 266 78 C266 90 258 98 246 98 C236 98 226 90 226 78 Z"/>
      <!-- round helmet with a rim -->
      <path d="M222 74 C222 56 234 46 247 46 C260 46 271 56 271 74 Z"/>
    </g>
  </defs>

  <!-- deck between the gunwales, narrowing toward the bow -->
  <path d="M0 280 L16 222 Q150 182 266 152 L298 152 Q414 182 544 222 L560 280 Z" fill="#0A121E"/>
  <path d="M120 280 Q200 214 270 162 L290 162 Q360 214 440 280 Z" fill="#101C30"/>

  <!-- hull sides -->
  <path d="M0 280 L0 230 Q132 186 266 146 L272 160 Q142 202 34 280 Z" fill="url(#hull-side)"/>
  <path d="M560 280 L560 230 Q428 186 294 146 L288 160 Q418 202 526 280 Z" fill="url(#hull-side)"/>

  <!-- round shields along the gunwales, smaller toward the bow -->
  <g stroke="#0A121E" stroke-width="3">
    <circle cx="34" cy="226" r="24" fill="#1A2E52"/>
    <circle cx="92" cy="206" r="20" fill="#13233F"/>
    <circle cx="144" cy="190" r="16" fill="#1A2E52"/>
    <circle cx="188" cy="176" r="13" fill="#13233F"/>
    <circle cx="526" cy="226" r="24" fill="#13233F"/>
    <circle cx="468" cy="206" r="20" fill="#1A2E52"/>
    <circle cx="416" cy="190" r="16" fill="#13233F"/>
    <circle cx="372" cy="176" r="13" fill="#1A2E52"/>
  </g>
  <g fill="#FFC107" fill-opacity="0.55">
    <circle cx="34" cy="226" r="5"/>
    <circle cx="92" cy="206" r="4"/>
    <circle cx="144" cy="190" r="3.5"/>
    <circle cx="188" cy="176" r="3"/>
    <circle cx="526" cy="226" r="5"/>
    <circle cx="468" cy="206" r="4"/>
    <circle cx="416" cy="190" r="3.5"/>
    <circle cx="372" cy="176" r="3"/>
  </g>

  <!-- bow post curling into a spiral -->
  <path d="M286 156 C282 124 284 100 296 88 C310 76 330 86 326 102 C323 114 308 114 307 104 C306 98 314 96 316 101"
        fill="none" stroke="#0A121E" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- warrior: faint cyan rim (lit by the storm), then the silhouette -->
  <use href="#warrior" xlink:href="#warrior" fill="#00E5FF" fill-opacity="0.3" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="5" stroke-linejoin="round" transform="translate(0 6)"/>
  <use href="#warrior" xlink:href="#warrior" fill="#0A121E" transform="translate(0 6)"/>

  <!-- braided beard swinging past the cheek, picked out by the same rim light -->
  <g transform="translate(0 6)" fill="#0A121E" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="2">
    <ellipse cx="266" cy="96" rx="6.5" ry="8"/>
    <ellipse cx="270" cy="110" rx="6" ry="7.5"/>
    <ellipse cx="271" cy="124" rx="5.5" ry="7"/>
    <ellipse cx="270" cy="137" rx="4.5" ry="6"/>
    <path d="M268 143 L272 154 L266 152 Z"/>
  </g>
</svg>
