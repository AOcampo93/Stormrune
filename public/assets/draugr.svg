<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="170" height="230" viewBox="0 0 170 230">
  <!-- Draugr: a hunched undead warrior walking toward the viewer.
       Flat silhouette; the outline is drawn first, then the same shapes are
       filled on top, so only the outer edge of the figure shows a rim. -->
  <defs>
    <radialGradient id="eye-glow">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <g id="figure">
      <!-- bent legs, feet apart -->
      <path d="M62 148 L50 190 L54 220 L36 230 L70 230 L66 192 L80 154 Z"/>
      <path d="M92 154 L108 192 L102 230 L134 230 L118 220 L122 188 L110 148 Z"/>
      <!-- ragged tunic hem -->
      <path d="M44 96 L32 174 L44 166 L50 184 L60 168 L70 188 L80 170 L90 190 L100 171 L110 186 L118 167 L130 180 L130 96 Z"/>
      <!-- torso, hunched forward under sloping shoulders -->
      <path d="M40 94 C42 78 54 70 68 70 L104 70 C118 70 130 78 132 94 L122 152 L50 152 Z"/>
      <!-- left arm hanging long and thin, ending in claws -->
      <path d="M44 86 C32 108 28 140 30 172 L23 192 L31 185 L33 197 L37 185 L42 195 L41 174 C41 144 46 116 56 98 Z"/>
      <!-- right arm gripping a notched blade -->
      <path d="M128 86 C140 106 144 130 142 156 L131 158 C131 134 126 112 116 98 Z"/>
      <path d="M130 150 L143 147 L152 210 L146 222 L140 212 L142 200 L136 195 Z"/>
      <!-- head sunk between the shoulders -->
      <path d="M66 70 C66 52 76 42 86 42 C98 42 106 52 106 66 L104 78 C100 87 93 91 86 91 C78 91 71 87 68 78 Z"/>
      <!-- dented round helmet with a nose guard -->
      <path d="M62 63 C62 46 73 35 86 35 C93 35 97 37 100 40 L94 44 L102 46 C106 51 109 56 110 63 Z"/>
      <path d="M84 60 L88 60 L88 77 L84 77 Z"/>
    </g>
  </defs>

  <use href="#figure" xlink:href="#figure" fill="#1C3357" stroke="#1C3357" stroke-width="5" stroke-linejoin="round"/>
  <use href="#figure" xlink:href="#figure" fill="#0A121E"/>

  <!-- two faintly glowing eyes -->
  <circle cx="76" cy="69" r="8" fill="url(#eye-glow)"/>
  <circle cx="96" cy="69" r="8" fill="url(#eye-glow)"/>
  <circle cx="76" cy="69" r="2" fill="#E0FCFF"/>
  <circle cx="96" cy="69" r="2" fill="#E0FCFF"/>
</svg>
